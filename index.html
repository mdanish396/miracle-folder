<!DOCTYPE html>
<html lang="en">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Open Graph / Social sharing -->
    <meta property="og:title" content="Building lasting value for the community">
    <meta property="og:site_name" content="Miracle Land Holdings Berhad">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Established developer dedicated to high-quality developments across Pahang.">
    <meta property="og:image" content="https://miracleland.co/og-image.png">
    <meta property="og:url" content="https://miracleland.co">

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">

    <!-- Apple / PWA -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
